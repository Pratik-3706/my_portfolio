name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # edits the checkout only, nothing is committed. if this fails the
      # deploy stops and the live site stays as it was
      - name: List merged pull requests
        run: node scripts/open-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html style.css main.js assets _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
